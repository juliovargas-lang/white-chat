<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>White Chat — Skins</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #eef1f5; color: #1f2328; }
    header { padding: 20px 24px; }
    header h1 { margin: 0 0 4px; font-size: 20px; }
    header p { margin: 0; color: #656d76; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 0 24px 24px; }
    .cell { background: #fff; border: 1px solid #dfe3e8; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .cell h2 { margin: 0; font-size: 14px; padding: 10px 14px; border-bottom: 1px solid #eef1f5; }
    .cell code { font-weight: 400; color: #656d76; }
    /* Each skin runs in its own iframe so the fixed-position widgets don't overlap. */
    .cell iframe { border: 0; width: 100%; height: 560px; background: #fafafa; }
  </style>
</head>
<body>
  <header>
    <h1>White Chat — skins</h1>
    <p>Each panel embeds the widget with a different <code>data-skin</code>. Click the bubble to open.</p>
  </header>
  <div class="grid" id="grid"></div>
  <script>
    const SKINS = ['classic', 'dark', 'minimal', 'soft'];
    const grid = document.getElementById('grid');
    for (const skin of SKINS) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const h2 = document.createElement('h2');
      h2.innerHTML = skin + ' &mdash; <code>data-skin="' + skin + '"</code>';
      const iframe = document.createElement('iframe');
      iframe.src = 'demo.html?skin=' + skin;
      iframe.title = skin + ' skin';
      cell.append(h2, iframe);
      grid.append(cell);
    }
  </script>
</body>
</html>
