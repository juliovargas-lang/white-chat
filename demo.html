<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>White Chat — Demo</title>
  <!-- Deliberately aggressive host styles: the widget must not be affected (Shadow DOM). -->
  <style>
    * { font-family: "Comic Sans MS", cursive !important; color: darkred; letter-spacing: 2px; }
    button { background: yellow !important; border: 4px dashed red !important; }
    input, textarea { font-size: 28px; }
    div { padding: 6px; }
    body { background: #fafafa; max-width: 720px; margin: 40px auto; }
  </style>
</head>
<body>
  <h1>Host site demo</h1>
  <p>This page embeds the chat widget with the snippet below. Its own CSS is intentionally ugly to check style isolation.</p>
  <pre>&lt;script src="/widget/chat-widget.js"
        data-supabase-url="..." data-supabase-key="..." defer&gt;&lt;/script&gt;</pre>

  <!-- Same embed as the snippet above, with URL/key taken from config.js (single place to change). -->
  <script src="config.js"></script>
  <script>
    const s = document.createElement('script');
    s.src = 'widget/chat-widget.js';
    s.dataset.supabaseUrl = window.WHITE_CHAT_CONFIG.SUPABASE_URL;
    s.dataset.supabaseKey = window.WHITE_CHAT_CONFIG.SUPABASE_ANON_KEY;
    // Look attributes can be tried from the page URL, e.g. demo.html?skin=dark
    const q = new URLSearchParams(location.search);
    for (const name of ['skin', 'primary-color', 'secondary-color', 'chat-name']) {
      if (q.has(name)) s.setAttribute('data-' + name, q.get(name));
    }
    document.body.append(s);
  </script>
</body>
</html>
